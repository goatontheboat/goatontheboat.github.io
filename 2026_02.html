<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2026. 02.</title>
    <style>
        body { 
            background: #fff; 
            color: #000; 
            font-family: 'Times New Roman', serif; 
            padding: 40px; 
            position: relative;
            font-weight: 900;
        }

        /* 상단 좌측 그림판 스타일 화살표 (2026 메인 복귀) */
        .top-left-back {
            position: absolute;
            top: 40px;
            left: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            mix-blend-mode: multiply;
            transition: transform 0.1s ease-out, opacity 0.1s;
        }

        .top-left-back:hover { 
            transform: translateX(-5px); 
            opacity: 0.8; 
        }

        .mspaint-arrow {
            width: 50px;
            height: 30px;
            fill: #7DE2D1; 
            stroke: #000000;
            stroke-width: 1px; 
            stroke-linejoin: round;
        }

        /* 화살표 아래로 내려온 헤더 영역 */
        .header { 
            border-bottom: 3px solid #000; 
            padding-bottom: 25px; 
            margin-bottom: 40px; 
            margin-top: 60px; 
        }

        /* 2026. 02. 메인 글리치 타이틀 스타일 */
        .glitch-title {
            display: flex;
            text-decoration: none;
            mix-blend-mode: multiply;
            margin: 0;
            line-height: 1;
            gap: 15px;
            align-items: center;
        }

        .char {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 3px 0 #FF71A7, -3px 0 #36BAFF;
            display: inline-block;
        }

        /* 글자별 다채로운 글리치 색상 조합 */
        .c1 { color: #36BAFF; text-shadow: 3px 0 #FF71A7; }
        .c2 { color: #FF71A7; text-shadow: 3px 0 #FFE86E; }
        .c3 { color: #FFE86E; text-shadow: 3px 0 #7DE2D1; }
        .c4 { color: #7DE2D1; text-shadow: 3px 0 #36BAFF; }
        .c5 { color: #FF71A7; text-shadow: 3px 0 #36BAFF; }
        .c6 { color: #36BAFF; text-shadow: 3px 0 #FFE86E; }
        .c7 { color: #FFE86E; text-shadow: 3px 0 #FF71A7; }
        .c8 { color: #7DE2D1; text-shadow: 3px 0 #FF71A7; }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .card { border: 3px solid #000; padding: 30px; background: #fff; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; text-transform: uppercase; font-weight: 900; }
        
        /* 2026년 포인트 컬러: 하늘색 */
        .impact-score { font-size: 4rem; font-weight: 900; color: #36BAFF; text-shadow: 3px 0 #FFE86E; }
        
        iframe { width: 100%; height: 250px; border: 3px solid #000; margin-top: 15px; }
        
        /* 푸터 스타일 통일 */
        footer { margin-top: 50px; text-align: center; border-top: 3px solid #000; padding-top: 30px; font-weight: 900; }
        .sns-links a, .sns-links .email-text { 
            margin: 0 20px; color: #000; font-weight: 900; 
            font-family: 'Times New Roman', serif; text-decoration: none; 
            mix-blend-mode: multiply;
        }
        .sns-links a:hover { color: #FF71A7; opacity: 0.8; }
    </style>
</head>
<body>

    <!-- 상단 좌측 그림판 스타일 화살표 (2026 메인 복귀) -->
    <a href="2026.html" class="top-left-back" title="BACK TO 2026">
        <svg class="mspaint-arrow" viewBox="0 0 100 60">
            <polygon points="100,20 40,20 40,0 0,30 40,60 40,40 100,40" />
        </svg>
    </a>

    <!-- 화살표 아래로 내려온 '2026. 02.' 타이틀 영역 -->
    <div class="header">
        <h1 class="glitch-title">
            <span class="char c1">2</span>
            <span class="char c2">0</span>
            <span class="char c3">2</span>
            <span class="char c4">6</span>
            <span class="char c5" style="margin-left: 5px; margin-right: 2px;">.</span>
            <span class="char c6">0</span>
            <span class="char c7">2</span>
            <span class="char c8" style="margin-left: 2px;">.</span>
        </h1>
    </div>

    <div class="grid-container">

        </div>
        <div class="card">

                <li style="margin-bottom: 10px;">NEW SUBSCRIBERS: +20</li>
                <li style="margin-bottom: 10px;">RETURNING VIEWERS: 507</li>
                <li>UNIQUE VIEWERS: 7,500</li>
            </ul>
        </div>
    </div>

    <div class="grid-container">
        <div class="card">
            <h2>TOP PERFORMING MUSIC (37 VIEWS)</h2>
            <iframe src="https://www.youtube.com/embed/GYwBwgNaGls" allowfullscreen></iframe>
        </div>
        <div class="card">
            <h2>TOP PERFORMING SHORTS (2,374 VIEWS)</h2>
            <iframe src="https://www.youtube.com/embed/dFfeukJb1Uc" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        <div class="sns-links">
            <a href="https://www.youtube.com/@goat_on_the_boat" target="_blank">YOUTUBE</a>
            <a href="https://www.instagram.com/goatontheboat_kr/" target="_blank">INSTAGRAM</a>
            <span class="email-text">EMAIL: dldbwls980112@gmail.com</span>
        </div>
    </footer>
</body>
</html>
