<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2025</title>
    <style>
        body { 
            background: #fff; 
            color: #000; 
            font-family: 'Times New Roman', serif; 
            padding: 40px; 
            position: relative;
            font-weight: 900;
        }

        /* 상단 좌측 그림판 스타일 화살표 (메인 복귀) */
        .top-left-back {
            position: absolute;
            top: 40px;
            left: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            mix-blend-mode: multiply;
            transition: transform 0.1s ease-out, opacity 0.1s;
        }

        .top-left-back:hover { 
            transform: translateX(-5px); 
            opacity: 0.8; 
        }

        .mspaint-arrow {
            width: 50px;
            height: 30px;
            fill: #7DE2D1; 
            stroke: #000000;
            stroke-width: 1px; 
            stroke-linejoin: round;
        }

        /* 화살표 아래에 큼직하게 배치될 헤더 영역 */
        .header { 
            border-bottom: 3px solid #000; 
            padding-bottom: 25px; 
            margin-bottom: 40px; 
            margin-top: 60px; /* 화살표와의 간격을 확보하여 아래로 배치 */
            padding-left: 0; 
        }

        /* 2025 메인 글리치 타이틀 스타일 (화면 비례에 맞춰 큼직하게 설정) */
        .glitch-title {
            display: flex;
            text-decoration: none;
            mix-blend-mode: multiply;
            margin: 0;
            line-height: 1;
            gap: 15px;
        }

        .char {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 3px 0 #FF71A7, -3px 0 #36BAFF;
            display: inline-block;
        }

        /* 색상 패턴 */
        .c1 { color: #FF71A7; text-shadow: 3px 0 #7DE2D1; }
        .c2 { color: #36BAFF; text-shadow: 3px 0 #FFE86E; }
        .c3 { color: #FFE86E; text-shadow: 3px 0 #FF71A7; }
        .c4 { color: #7DE2D1; text-shadow: 3px 0 #36BAFF; }

        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
        }

        .card { 
            border: 3px solid #000; 
            padding: 30px; 
            background: #fff; 
            transition: transform 0.2s; 
        }

        .card:hover { transform: translateY(-5px); }

        h2 { 
            font-size: 1.2rem; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        
        /* 포인트 컬러 적용 */
        .impact-score { 
            font-size: 4rem; 
            font-weight: 900; 
            color: #FF71A7; 
            text-shadow: 3px 0 #7DE2D1;
        } 

        iframe { 
            width: 100%; 
            height: 300px; 
            border: 3px solid #000; 
            margin-top: 15px; 
        }
        
        footer { 
            margin-top: 50px; 
            text-align: center; 
            border-top: 3px solid #000; 
            padding-top: 30px; 
            font-weight: 900;
        }

        .sns-links a, .sns-links .email-text { 
            margin: 0 20px; 
            color: #000; 
            text-decoration: none; 
            font-weight: 900; 
            mix-blend-mode: multiply;
        }

        .sns-links a:hover { 
            color: #FF71A7; 
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- 상단 좌측 그림판 스타일 화살표 (메인 복귀) -->
    <a href="year_select.html" class="top-left-back" title="BACK TO MAIN">
        <svg class="mspaint-arrow" viewBox="0 0 100 60">
            <polygon points="100,20 40,20 40,0 0,30 40,60 40,40 100,40" />
        </svg>
    </a>

    <!-- 화살표 아래로 내려온 큼직한 '2025' 타이틀 영역 -->
    <div class="header">
        <h1 class="glitch-title">
            <span class="char c1">2</span>
            <span class="char c2">0</span>
            <span class="char c3">2</span>
            <span class="char c4">5</span>
        </h1>
    </div>

    <div class="grid-container">
        <div class="card">
            <h2>TOTAL INTEGRATED IMPACT</h2>
            <div class="impact-score">228,058</div>
        </div>
        <div class="card">
            <h2>PLATFORM BREAKDOWN</h2>
            <ul style="list-style: none; padding: 0; font-weight: 900; line-height: 1.8; font-size: 1.1rem;">
                <li>YOUTUBE: 228,000</li>
                <li>SPOTIFY: 58</li>
                <li>APPLE MUSIC: 0</li>
            </ul>
        </div>
    </div>

    <div class="grid-container" style="margin-top: 30px;">
        <div class="card">
            <h2>TOP PERFORMING MUSIC</h2>
            <iframe src="https://www.youtube.com/embed/feJyRrQAvY4" allowfullscreen></iframe>
        </div>
        <div class="card">
            <h2>TOP PERFORMING SHORTS</h2>
            <iframe src="https://www.youtube.com/embed/a7pJOTG-1XQ" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        <div class="sns-links">
            <a href="https://www.youtube.com/@goat_on_the_boat" target="_blank">YOUTUBE</a>
            <a href="https://www.instagram.com/goatontheboat_kr/" target="_blank">INSTAGRAM</a>
            <span class="email-text">EMAIL: dldbwls980112@gmail.com</span>
        </div>
    </footer>
</body>
</html>
