<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Select Year - goat on the boat</title>
    <style>
        body { 
            margin: 0; background: #fff; display: flex; flex-direction: column; 
            min-height: 100vh; font-family: 'Times New Roman', serif;
        }

        .select-container { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
        }

        /* 연도 링크: 크기를 조금 키워 포트폴리오 길이와 맞춤 */
        .year-link { 
            text-decoration: none; 
            font-size: 14vw; /* 기존 10vw에서 확대 */
            font-weight: 900; 
            margin: 5px 0; 
            transition: transform 0.1s ease-out;
            cursor: pointer; 
            mix-blend-mode: multiply;
            letter-spacing: -0.5vw; /* 숫자가 너무 퍼지지 않게 조절 */
        }

        .year-link:hover { transform: translateY(-8px); opacity: 0.8; }
        .c-2025 { color: #FF71A7; text-shadow: 4px 0 #7DE2D1; }
        .c-2026 { color: #36BAFF; text-shadow: 4px 0 #FFE86E; }

        /* 포트폴리오 글리치: 전체 길이를 연도와 일치시킴 */
        .portfolio-glitch {
            text-decoration: none;
            display: flex;
            justify-content: center;
            width: 40vw; /* 연도 4글자의 가로 폭과 비슷하게 고정 */
            margin-top: 30px; 
            transition: transform 0.1s ease-out;
            mix-blend-mode: multiply;
        }

        .portfolio-glitch:hover { transform: translateY(-5px); opacity: 0.8; }

        .char {
            font-size: 4.8vw; /* 글자 수를 고려하여 크기 축소 */
            font-weight: 900;
            line-height: 1;
            text-shadow: 2px 0 #FF6B6B, -2px 0 #4ECDC4;
            display: inline-block;
            letter-spacing: -0.2vw; /* 자간을 좁혀서 밀도감 형성 */
        }

        /* 색상 패턴 */
        .c1 { color: #FF6B6B; } .c2 { color: #4ECDC4; } 
        .c3 { color: #FFE66D; } .c4 { color: #FF9F1C; } 
        .c5 { color: #2D9CDB; } .c6 { color: #BB6BD9; } 
        .c7 { color: #27AE60; } .c8 { color: #F783AC; }

        footer { padding: 50px 20px; text-align: center; font-size: 0.9rem; font-weight: 900; }
        .sns-links a, .sns-links .email-text { 
            margin: 0 20px; color: #000; text-decoration: none; 
            font-weight: 900; font-family: 'Times New Roman', serif;
        }
    </style>
</head>
<body>

    <div class="select-container">
        <!-- 연도 선택 -->
        <a href="2025.html" class="year-link c-2025">2025</a>
        <a href="2026.html" class="year-link c-2026">2026</a>
        
        <!-- 포트폴리오 글리치 (가로 길이 최적화) -->
        <a href="portfolio.html" class="portfolio-glitch">
            <span class="char c1">P</span>
            <span class="char c2">O</span>
            <span class="char c3">R</span>
            <span class="char c4">T</span>
            <span class="char c5">F</span>
            <span class="char c6">O</span>
            <span class="char c7">L</span>
            <span class="char c8">I</span>
            <span class="char c1">O</span>
        </a>
    </div>

    <footer>
        <div class="sns-links">
            <a href="https://www.youtube.com/@goat_on_the_boat" target="_blank">YOUTUBE</a>
            <a href="https://www.instagram.com/goatontheboat_kr/" target="_blank">INSTAGRAM</a>
            <span class="email-text">EMAIL: dldbwls980112@gmail.com</span>
        </div>
    </footer>

</body>
</html>
